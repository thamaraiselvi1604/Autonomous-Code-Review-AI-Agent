# Enable Java 21 Virtual Threads natively for maximum throughput
spring.threads.virtual.enabled=true

# CRUCIAL FIX: Route traffic directly inside the internal container network
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=compliance-agent-group
spring.kafka.consumer.auto-offset-reset=earliest

# LangChain4j OpenAI connection parameters
langchain4j.open-ai.chat-model.api-key=YOUR_OPENAI_API_KEY_HERE
langchain4j.open-ai.chat-model.model-name=gpt-4o
langchain4j.open-ai.chat-model.temperature=0.2

