# Native Java 21 thread optimization configurations
spring.threads.virtual.enabled=true

# CRUCIAL FIX: Stop routing through public forward URLs and stick to internal container ports
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=compliance-agent-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.agent

# Bound request time while Kafka metadata is unavailable
spring.kafka.producer.properties[max.block.ms]=5000

# Limit individual packet buffers to protect JVM heap boundaries
spring.kafka.producer.properties.max.request.size=1048576
spring.kafka.consumer.max-partition-fetch-bytes=1048576

# LangChain4j OpenAI credentials management
langchain4j.open-ai.chat-model.api-key=YOUR_OPENAI_API_KEY_HERE
langchain4j.open-ai.chat-model.model-name=gpt-4o
langchain4j.open-ai.chat-model.temperature=0.2


